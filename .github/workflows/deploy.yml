name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Detect project framework and name
      id: detect
      run: |
        if [ -f "angular.json" ]; then
          echo "framework=angular" >> $GITHUB_OUTPUT
          PROJECT_NAME=$(jq -r '.projects | keys[0]' angular.json)
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "dist_folder=dist/$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "build_command=npm run build -- --base-href '/${{ github.event.repository.name }}/'" >> $GITHUB_OUTPUT
        elif [ -f "package.json" ] && grep -q "react" package.json; then
          echo "framework=react" >> $GITHUB_OUTPUT
          echo "project_name=react-app" >> $GITHUB_OUTPUT
          echo "dist_folder=build" >> $GITHUB_OUTPUT
          echo "build_command=npm run build" >> $GITHUB_OUTPUT
        elif [ -f "package.json" ] && grep -q "vue" package.json; then
          echo "framework=vue" >> $GITHUB_OUTPUT
          echo "project_name=vue-app" >> $GITHUB_OUTPUT
          echo "dist_folder=dist" >> $GITHUB_OUTPUT
          echo "build_command=npm run build" >> $GITHUB_OUTPUT
        else
          echo "framework=unknown" >> $GITHUB_OUTPUT
          echo "project_name=unknown" >> $GITHUB_OUTPUT
          echo "dist_folder=dist" >> $GITHUB_OUTPUT
          echo "build_command=npm run build" >> $GITHUB_OUTPUT
        fi
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: ${{ steps.detect.outputs.build_command }}
      
    - name: Copy index.html to 404.html (for SPA routing)
      run: |
        if [ "${{ steps.detect.outputs.framework }}" = "angular" ]; then
          cp ${{ steps.detect.outputs.dist_folder }}/index.html ${{ steps.detect.outputs.dist_folder }}/404.html
        fi
      
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ steps.detect.outputs.dist_folder }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Output deployed page URL
      run: |
        echo "🚀 Successfully deployed to: ${{ steps.deployment.outputs.page_url }}"
        echo "📝 Your application is now live at the above URL"